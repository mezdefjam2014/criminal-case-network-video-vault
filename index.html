<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criminal Case Network — Video Vault</title>
<meta name="description" content="Every Criminal Case Network documentary in one place. Free to watch.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=13">
</head>
<body>

<header class="nav" id="nav">
  <a class="brand" href="./" aria-label="Criminal Case Network home">
    <span class="brand-mark">CCN</span>
    <span class="brand-name">Criminal Case Network</span>
  </a>
  <nav class="links" id="links" aria-label="Sections"></nav>
  <button class="mine-tab" id="mine-tab">My List</button>
  <div class="search" id="search">
    <button id="q-open" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  </div>
</header>

<main>
  <section class="hero" id="hero" aria-label="Featured film"></section>
  <div class="rows" id="rows"></div>
  <p class="empty" id="empty" hidden>No films match that search.</p>
</main>

<footer class="foot">
  <div class="foot-brand">Criminal Case Network</div>
  <p>Every film is free to watch and streams from our YouTube channel.</p>
  <p class="small">&copy; <span id="yr"></span> Criminal Case Network. All rights reserved.</p>
  <a class="foot-mark" href="office.html" rel="nofollow" tabindex="-1" aria-hidden="true">CCN</a>
</footer>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="sheet">
    <button class="close" id="close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="theater" id="theater">
      <div class="stage" id="stage"></div>
      <div class="ctrl" id="ctrl" hidden>
        <input class="seek" id="c-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <div class="ctrl-row">
          <button id="c-play" aria-label="Play or pause"></button>
          <button id="c-back" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M11 5 6 9l5 4"/><path d="M6 9h7a6 6 0 1 1-6 6"/></svg><span>10</span></button>
          <button id="c-fwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="m13 5 5 4-5 4"/><path d="M18 9h-7a6 6 0 1 0 6 6"/></svg><span>10</span></button>
          <button id="c-mute" aria-label="Mute"></button>
          <input class="vol" id="c-vol" type="range" min="0" max="100" value="100" aria-label="Volume">
          <span class="time" id="c-time">0:00 / 0:00</span>
          <span class="grow"></span>
          <select id="c-speed" aria-label="Playback speed"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
          <button id="c-full" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
    </div>
    <div class="info">
      <h2 id="m-title"></h2>
      <p class="meta" id="m-meta"></p>
      <div id="m-extra"></div>
      <p class="desc" id="m-desc"></p>
    </div>
  </div>
</div>

<div class="spot" id="spot" hidden>
  <div class="spot-box" role="dialog" aria-label="Search films">
    <div class="spot-bar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="text" placeholder="Search films" aria-label="Search films" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div class="spot-list" id="spot-list"></div>
  </div>
</div>

<script src="app.js?v=13"></script>
</body>
</html>
